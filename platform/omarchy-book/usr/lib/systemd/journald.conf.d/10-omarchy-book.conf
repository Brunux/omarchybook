# The device's storage is a small, slow eMMC or SD card, and systemd's default
# (10% of the filesystem) lets the journal grow to several GiB there. Keep it
# bounded and rotate early enough that writing to it is not a surprise.
#
# An administrator who wants more overrides this from
# /etc/systemd/journald.conf.d/, which systemd reads after vendor drop-ins.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=50M
